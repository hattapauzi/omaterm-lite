# OSC 52 clipboard for SSH/tmux. LazyGit's default Linux clipboard lookup
# wants wl-copy/xclip/xsel, which do not exist on headless remotes.
os:
  copyToClipboardCmd: >
    if [[ "$TERM" =~ ^(screen|tmux) ]]; then
      printf "\\033Ptmux;\\033\\033]52;c;$(printf %s "{{text}}" | base64 -w 0)\\007\\033\\\\" > /dev/tty
    else
      printf "\\033]52;c;$(printf %s "{{text}}" | base64 -w 0)\\007" > /dev/tty
    fi
